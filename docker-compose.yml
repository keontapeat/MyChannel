services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mychannel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pg_root:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "56379:6379"

  channelboost:
    build:
      context: .
      dockerfile: services/channelboost-api/infra/Dockerfile.api
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      CB_API_TOKEN: supersecrettoken
    depends_on:
      - db
      - redis
    ports:
      - "8877:8787"

  channelboost-worker:
    build:
      context: .
      dockerfile: services/channelboost-api/infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  gateway:
    build:
      context: .
      dockerfile: services/gateway/infra/Dockerfile
    environment:
      PORT: 8088
      CHANNELBOOST_URL: http://channelboost:8787
      PAY_URL: http://pay:8888
      CHANNELMIND_URL: http://channelmind:8080
      PROTECT_URL: http://protect:9091
      IQ_URL: http://iq:9092
      ADS_URL: http://ads:9093
      REWARDS_URL: http://rewards:9094
      TRANSLATE_URL: http://translate:9095
      LABS_URL: http://labs:9096
      VAULT_URL: http://core-vault:9097
      CONNECT_URL: http://connect:9098
      DOCTOR_URL: http://doctor:9099
    depends_on:
      - channelboost
      - pay
    ports:
      - "8088:8088"

  pay:
    build:
      context: .
      dockerfile: services/pay-api/infra/Dockerfile
    environment:
      PORT: 8888
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      STRIPE_SECRET: sk_test_123
    depends_on:
      - db
    ports:
      - "8888:8888"

  channelmind:
    build:
      context: .
      dockerfile: services/video-understanding/infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      REDIS_URL: redis://redis:6379/0
      API_AUTH_TOKEN: supersecrettoken
      GCS_BUCKET: mc-videos
      GCP_PROJECT: local
      INDEX_PATH: /app/data/indexes/main.faiss
      FRAME_FPS: 0.5
      KEYFRAME_INTERVAL_SEC: 2
      MAX_UPLOAD_MB: 512
    depends_on:
      - db
      - redis
    ports:
      - "8089:8080"

  channelmind-worker:
    build:
      context: .
      dockerfile: services/video-understanding/infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      REDIS_URL: redis://redis:6379/0
      GCS_BUCKET: mc-videos
      GCP_PROJECT: local
      INDEX_PATH: /app/data/indexes/main.faiss
      FRAME_FPS: 0.5
      KEYFRAME_INTERVAL_SEC: 2
      MAX_UPLOAD_MB: 512
    depends_on:
      - db
      - redis

  protect:
    build:
      context: .
      dockerfile: services/protect/infra/Dockerfile
    environment:
      PORT: 9091
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9091:9091"

  iq:
    build:
      context: .
      dockerfile: services/iq/infra/Dockerfile
    environment:
      PORT: 9092
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9092:9092"

  ads:
    build:
      context: .
      dockerfile: services/ads/infra/Dockerfile
    environment:
      PORT: 9093
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9093:9093"

  rewards:
    build:
      context: .
      dockerfile: services/rewards/infra/Dockerfile
    environment:
      PORT: 9094
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9094:9094"

  translate:
    build:
      context: .
      dockerfile: services/translate/infra/Dockerfile
    environment:
      PORT: 9095
    depends_on:
      - db
    ports:
      - "9095:9095"

  labs:
    build:
      context: .
      dockerfile: services/labs/infra/Dockerfile
    environment:
      PORT: 9096
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9096:9096"

  core-vault:
    build:
      context: .
      dockerfile: services/core-vault/infra/Dockerfile
    environment:
      PORT: 9097
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9097:9097"

  connect:
    build:
      context: .
      dockerfile: services/connect/infra/Dockerfile
    environment:
      PORT: 9098
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
    depends_on:
      - db
    ports:
      - "9098:9098"

  doctor:
    build:
      context: .
      dockerfile: services/doctor/infra/Dockerfile
    environment:
      PORT: 9099
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mychannel
      GATEWAY_URL: http://gateway:8088
    depends_on:
      - db
      - gateway
    ports:
      - "9099:9099"
    restart: unless-stopped

volumes:
  pg_root:


