name: Health Probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN_URL: https://health-fkri6ifojq-uc.a.run.app

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: mychannel-ca26d
          export_default_credentials: true
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Fetch identity token
        id: token
        run: |
          ID_TOKEN=$(gcloud auth print-identity-token --audiences="${RUN_URL}")
          if [ -z "$ID_TOKEN" ]; then
            echo "Failed to get identity token" >&2
            exit 1
          fi
          echo "token=$ID_TOKEN" >> $GITHUB_OUTPUT

      - name: Probe health endpoint
        id: probe
        run: |
          start=$(date +%s)
          code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ steps.token.outputs.token }}" "${RUN_URL}")
          end=$(date +%s)
          lat=$(( (end-start)*1000 ))
          echo "code=$code" >> $GITHUB_OUTPUT
          echo "latency_ms=$lat" >> $GITHUB_OUTPUT
          echo "Health: code=$code latency=${lat}ms"
          if [ "$code" != "200" ]; then
            echo "Probe failed with HTTP $code" >&2
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: 'Health Probe Failed'
          SLACK_MESSAGE: |
            Health probe failed
            URL: ${{ env.RUN_URL }}
            HTTP: ${{ steps.probe.outputs.code }}
            Latency: ${{ steps.probe.outputs.latency_ms }} ms
          SLACK_FOOTER: 'GitHub Actions'

      - name: Send Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Health Probe Failed
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: true
          body: |
            Health probe failed
            URL: ${{ env.RUN_URL }}
            HTTP: ${{ steps.probe.outputs.code }}
            Latency: ${{ steps.probe.outputs.latency_ms }} ms
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
