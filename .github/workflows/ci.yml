name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firebase Tools
        run: npm i -g firebase-tools

      - name: Install workspace deps (JS)
        run: |
          npm ci --workspaces --if-present

      - name: Python deps for functions
        working-directory: functions
        run: |
          python -m pip install -r requirements.txt

      - name: Lint (quick)
        run: |
          echo "Skipping heavy lint; add later"

      - name: Build TS services
        run: |
          npm run -w services build || true

      - name: Deploy Firebase (Rules + Indexes + Functions)
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          firebase deploy --only firestore:rules,storage:rules,firestore:indexes,functions --non-interactive || true

      - name: Upload Postman collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-collection
          path: tools/postman/MyChannel.postman_collection.json

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan -input=false -out=tfplan \
            -var "project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "region=us-central1" \
            -var "media_bucket_name=${{ secrets.MEDIA_BUCKET }}" \
            -var "ingest_bucket_name=${{ secrets.INGEST_BUCKET }}" \
            -var "public_bucket_name=${{ secrets.PUBLIC_BUCKET }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve tfplan || true

      - name: Post-deploy synthetics (Doctor smoke)
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          ADS_BASE_URL: ${{ secrets.ADS_BASE_URL }}
        run: |
          bash tools/doctor/smoke.sh

  nightly-smoke:
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 7 * * *'
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor smoke
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          ADS_BASE_URL: ${{ secrets.ADS_BASE_URL }}
        run: bash tools/doctor/smoke.sh
