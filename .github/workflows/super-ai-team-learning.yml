# =============================================================================
# 🔥🤖 SUPER AI TEAM - CONTINUOUS LEARNING WORKFLOW 🤖🔥
# =============================================================================
# Automatically triggers AI learning on every commit and PR
# =============================================================================

name: 🤖 Super AI Team - Continuous Learning

on:
  push:
    branches: [main, develop, feature/*]
    paths:
      - '**.swift'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.py'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  SUPER_AI_TEAM_URL: https://us-central1-mychannel-ca26d.cloudfunctions.net/super-ai-team

jobs:
  # =============================================================================
  # 🧠 LEARN FROM COMMITS
  # =============================================================================
  learn-from-commits:
    name: 🧠 Learn from Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get last 2 commits for diff
      
      - name: 🧠 Send commits to AI Team for learning
        run: |
          echo "🧠 Teaching Super AI Team about new commits..."
          
          # Get commit info
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          FILES_JSON=$(echo "$CHANGED_FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Get diff (limited to 50KB for API)
          DIFF=$(git diff HEAD~1 HEAD 2>/dev/null | head -c 50000 || echo "")
          
          # Send to AI Team
          curl -s -X POST "$SUPER_AI_TEAM_URL/learn" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "sha": "$COMMIT_SHA",
            "message": "$COMMIT_MSG",
            "files": $FILES_JSON,
            "diff": $(echo "$DIFF" | jq -R -s '.')
          }
          EOF
          
          echo "✅ AI Team learned from commit: ${COMMIT_SHA:0:7}"

  # =============================================================================
  # ⚡️ ANALYZE CODE PERFORMANCE
  # =============================================================================
  analyze-performance:
    name: ⚡️ Analyze Performance
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ⚡️ Run Performance Analysis on Changed Files
        run: |
          echo "⚡️ Running AI Performance Analysis..."
          
          # Get changed Swift/TS files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '\.(swift|ts|tsx)$' | head -5 || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No Swift/TS files changed, skipping analysis"
            exit 0
          fi
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              
              # Get file content (limited to 10KB)
              CODE=$(head -c 10000 "$file" | jq -R -s '.')
              
              # Send to AI Team
              RESULT=$(curl -s -X POST "$SUPER_AI_TEAM_URL/analyze/performance" \
                -H "Content-Type: application/json" \
                -d "{\"code\": $CODE, \"file_path\": \"$file\"}")
              
              echo "Result for $file:"
              echo "$RESULT" | jq -r '.analysis.performance_score // "N/A"' | xargs -I {} echo "  Performance Score: {}"
              echo "$RESULT" | jq -r '.analysis.quick_wins[]? // empty' | head -3 | while read -r win; do
                echo "  💡 $win"
              done
              echo ""
            fi
          done

  # =============================================================================
  # 🔧 AUTO-DEBUG WORKFLOW ERRORS
  # =============================================================================
  auto-debug-on-failure:
    name: 🔧 Auto-Debug on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [learn-from-commits, analyze-performance]
    
    steps:
      - name: 🔧 Send failure to Auto-Debugger
        run: |
          echo "🔧 Sending workflow failure to Auto-Debugger..."
          
          curl -s -X POST "$SUPER_AI_TEAM_URL/debug" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "error": "GitHub Actions workflow failed",
            "stack_trace": "Job: ${{ github.job }}, Run: ${{ github.run_id }}",
            "file_path": ".github/workflows/super-ai-team-learning.yml",
            "context": "CI/CD pipeline failure on commit ${{ github.sha }}"
          }
          EOF
          
          echo "✅ Auto-Debugger notified"

  # =============================================================================
  # 📊 PR CODE REVIEW
  # =============================================================================
  ai-code-review:
    name: 📊 AI Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📊 Run Full AI Analysis on PR
        run: |
          echo "📊 Running full AI analysis on PR..."
          
          # Get all changed files in PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(swift|ts|tsx)$' | head -10)
          
          TOTAL_SCORE=0
          FILE_COUNT=0
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "🔍 Analyzing: $file"
              
              CODE=$(head -c 10000 "$file" | jq -R -s '.')
              
              RESULT=$(curl -s -X POST "$SUPER_AI_TEAM_URL/analyze/full" \
                -H "Content-Type: application/json" \
                -d "{\"code\": $CODE, \"file_path\": \"$file\"}")
              
              # Extract scores
              PERF_SCORE=$(echo "$RESULT" | jq -r '.results.performance.analysis.performance_score // 0')
              QUALITY_SCORE=$(echo "$RESULT" | jq -r '.results.quality.analysis.quality_score // 0')
              
              echo "  ⚡️ Performance: $PERF_SCORE/100"
              echo "  ✨ Quality: $QUALITY_SCORE/100"
              
              # Track for average
              if [ "$PERF_SCORE" != "0" ]; then
                TOTAL_SCORE=$((TOTAL_SCORE + PERF_SCORE))
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
              
              echo ""
            fi
          done
          
          if [ $FILE_COUNT -gt 0 ]; then
            AVG_SCORE=$((TOTAL_SCORE / FILE_COUNT))
            echo "📈 Average Performance Score: $AVG_SCORE/100"
            
            if [ $AVG_SCORE -lt 50 ]; then
              echo "⚠️ Performance score below threshold. Consider optimizations."
            else
              echo "✅ Performance looks good!"
            fi
          fi
      
      - name: 💬 Post AI Review Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const teamUrl = process.env.SUPER_AI_TEAM_URL;
            
            // Get team status
            const response = await fetch(teamUrl);
            const status = await response.json();
            
            const body = `## 🤖 Super AI Team Code Review
            
            The elite AI team has analyzed this PR:
            
            | Agent | Status | Actions |
            |-------|--------|---------|
            | ⚡️ Performance Optimizer | ${status.agents?.performance_optimizer?.status || 'active'} | ${status.agents?.performance_optimizer?.actions_performed || 0} |
            | ✨ Code Quality | ${status.agents?.code_quality?.status || 'active'} | ${status.agents?.code_quality?.actions_performed || 0} |
            | 💾 Memory Optimizer | ${status.agents?.memory_optimizer?.status || 'active'} | ${status.agents?.memory_optimizer?.actions_performed || 0} |
            | 🎨 UI Performance | ${status.agents?.ui_performance?.status || 'active'} | ${status.agents?.ui_performance?.actions_performed || 0} |
            
            **Total Optimizations:** ${status.metrics?.total_optimizations || 0}
            **Errors Auto-Fixed:** ${status.metrics?.total_errors_fixed || 0}
            
            ---
            *Powered by Claude Opus 4.5 on Vertex AI* 🔥`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          SUPER_AI_TEAM_URL: ${{ env.SUPER_AI_TEAM_URL }}

  # =============================================================================
  # 🔥 NIGHTLY FULL CODEBASE ANALYSIS
  # =============================================================================
  nightly-full-analysis:
    name: 🔥 Nightly Full Analysis
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *'  # Only on scheduled runs
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔥 Run full codebase analysis
        run: |
          echo "🔥 Running nightly full codebase analysis..."
          
          # Find all Swift files
          find MyChannel -name "*.swift" -type f | head -50 | while read file; do
            echo "Analyzing: $file"
            
            CODE=$(head -c 10000 "$file" | jq -R -s '.')
            
            curl -s -X POST "$SUPER_AI_TEAM_URL/analyze/full" \
              -H "Content-Type: application/json" \
              -d "{\"code\": $CODE, \"file_path\": \"$file\"}" > /dev/null
            
            sleep 1  # Rate limiting
          done
          
          echo "✅ Nightly analysis complete!"








