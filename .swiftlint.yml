# SwiftLint Configuration for MyChannel
# This helps catch common errors before they become compiler issues

# Disable rules that are too strict for your codebase
disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - force_cast
  - force_try
  
# Enable opt-in rules that catch common issues
opt_in_rules:
  - empty_count
  - explicit_init
  - redundant_nil_coalescing
  - unused_import
  - unused_declaration
  - duplicate_imports

# Files to include/exclude
included:
  - MyChannel

excluded:
  - Pods
  - MyChannel/Generated
  - MyChannel/Resources
  - Scripts
  - .build
  - DerivedData

# Custom rules
custom_rules:
  # DI migration: prefer DependencyContainer + @Injected over new `.shared` singletons.
  # Enforced in CI via scripts/lint-no-new-shared.sh (baseline 3311 refs / 637 files).
  # Do not add new `static let shared` without registering in DependencyContainer.
  ban_new_shared_singleton:
    name: "Ban New Shared Singletons"
    regex: 'static\s+let\s+shared\s*='
    message: "Prefer DependencyContainer.register + @Injected; see docs/injected-property-wrapper.md"
    severity: warning

  # Catch potential duplicate declarations
  duplicate_type_name:
    name: "Duplicate Type Name"
    regex: '(struct|class|enum|protocol)\s+(\w+)'
    message: "Check for duplicate type names across files"
    severity: warning

  # Money paths — batch-7: discourage raw Double * 0.1 fee math in escrow utilities.
  no_raw_platform_fee_in_money:
    included: "MyChannel/Core/(Utils/MoneyMath|Services/MoneyEscrow|Services/MoneyEscrowing).*\\.swift"
    name: "No raw * 0.1 fee in money paths"
    regex: '\\*\\s*0\\.1'
    message: "Use MoneyMath.platformFeeCents — never raw * 0.1 on settlement amounts"
    severity: warning

# Reporter type
reporter: "xcode"

# Auto-fix settings
autocorrect: true

# Warning thresholds
warning_threshold: 100
error_threshold: 500


