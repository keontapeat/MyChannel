openapi: 3.0.0
info:
  title: MyChannel Health API
  version: 1.0.0
servers:
  - url: https://mychannel-health-gw.uc.gateway.dev
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      security:
        - api_key: []
      responses:
        '200':
          description: OK
      x-google-backend:
        address: https://us-central1-mychannel-ca26d.cloudfunctions.net/health
        protocol: h2
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: key
      in: query
